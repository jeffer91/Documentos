name: Validar app

on:
  push:
    branches:
      - main
      - documentos-v2-inteligente
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validar estructura y catálogo
        run: npm run check

      - name: Validar sintaxis PowerShell
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @("scripts/export-draft.ps1", "scripts/render-word.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "$file contiene errores de sintaxis: $($errors | ForEach-Object { $_.Message } | Out-String)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Smoke test SQLite
        run: xvfb-run -a npx electron --no-sandbox scripts/smoke-electron.cjs
