name: Validar app

on:
  push:
    branches:
      - main
      - documentos-v2-inteligente
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validar estructura y catálogo
        run: npm run check

      - name: Smoke test SQLite
        run: xvfb-run -a npx electron --no-sandbox scripts/smoke-electron.cjs
