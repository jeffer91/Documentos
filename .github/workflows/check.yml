name: Validar app

on:
  push:
    branches:
      - main
      - documentos-v2-inteligente
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar
        run: npm install --no-audit --no-fund

      - name: Publicar package-lock temporal
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-${{ github.sha }}
          path: package-lock.json
          retention-days: 1

      - name: Validar estructura y catálogo
        run: npm run check

      - name: Smoke test SQLite
        run: xvfb-run -a npx electron --no-sandbox scripts/smoke-electron.cjs
