<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentos ITSQMET</title>
  <link rel="stylesheet" href="./src/renderer/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" data-route="home" type="button" aria-label="Inicio">
        <span class="brand-mark">D</span>
        <span class="brand-copy"><b>Documentos</b><small>ITSQMET</small></span>
      </button>

      <nav class="nav" aria-label="Navegación principal">
        <button class="nav-item active" data-route="home" type="button"><span>⌂</span><b>Inicio</b></button>
        <button class="nav-item" data-route="library" type="button"><span>▤</span><b>Documentos</b></button>
        <button class="nav-item" data-route="templates" type="button"><span>▧</span><b>Plantillas</b></button>
        <button class="nav-item" data-route="ai" type="button"><span>✦</span><b>IA</b></button>
        <button class="nav-item" data-route="settings" type="button"><span>⚙</span><b>Ajustes</b></button>
      </nav>

      <div class="sidebar-foot">
        <span class="dot"></span>
        <span>Local</span>
        <b id="appVersion">v2.0.0</b>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div id="breadcrumb" class="breadcrumb">Inicio</div>
          <h1 id="screenTitle">Documentos</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="backButton" type="button" hidden aria-label="Volver">←</button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="./src/renderer/catalog.js"></script>
  <script src="./src/renderer/app.js"></script>
</body>
</html>
